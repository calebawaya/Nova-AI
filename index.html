<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="logo"><span>✦</span> Nova AI</div>
      <div class="status">● Online</div>
    </header>

    <main id="chat">
      <div class="message ai">
        <div class="avatar">✦</div>
        <div class="bubble">
          Hello! I'm <strong>Nova AI</strong> 🤖<br>
          Ask me anything!
        </div>
      </div>
    </main>

    <div class="input-area">
      <input id="userInput" type="text" placeholder="Ask Nova something..." autocomplete="off">
      <button id="sendBtn" aria-label="Send message">➤</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
